<!DOCTYPE html>
<html>
<head>
<title>Latihan III - Validasi Form JavaScript</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Latihan Form dengan Validasi JavaScript</h2>

<form id="myForm" onsubmit="return validateForm()">
<label for="nama">Nama (Wajib diisi):</label>
<input type="text" id="nama"
onfocus="this.style.background='#ffffcc'"
onblur="this.style.background='white'; validateNama()"><br><br>

<label for="email">Email:</label>
<input type="email" id="email"
onfocus="this.style.background='#ffffcc'"
onblur="this.style.background='white'; validateEmail()"><br><br>

<label for="umur">Umur (Angka 1 - 100):</label>
<input type="number" id="umur"
onfocus="this.style.background='#ffffcc'"
onblur="this.style.background='white'; validateUmur()"><br><br>

<input type="submit" value="Submit">
</form>

<script src="script.js"></script>

</body>
</html>
